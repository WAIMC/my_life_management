name: CI Pipeline

on:
  pull_request:
    branches:
      - dev

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Lint
        run: pnpm lint

      - name: Run Type-check
        run: pnpm type-check

      - name: Run Format check
        run: pnpm format:check

      - name: Run Security audit
        run: pnpm audit

      - name: Run Tests
        run: pnpm test
