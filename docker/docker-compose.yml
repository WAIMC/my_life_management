services:
  ml-php:
    container_name: ml-php
    build: ./laravel
    volumes:
      - ../laravel-api:/var/www/laravel-api
    environment:
      # PostgreSQL
      DB_HOST: ${POSTGRES_HOST_INSIDE_ENV}
      DB_PORT: ${POSTGRES_PORT_INSIDE_ENV}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Redis
      REDIS_HOST: ${REDIS_HOST_INSIDE_ENV}
      REDIS_PORT: ${REDIS_PORT_INSIDE_ENV}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - ml-postgres
      - ml-redis

  ml-nginx:
    container_name: ml-nginx
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../laravel-api:/var/www/laravel-api
      # - ./nextjs-fe:/var/www/nextjs
    ports:
      - "${NGINX_PORT_OUTSIDE_ENV}:${NGINX_PORT_INSIDE_ENV}"
    depends_on:
      - ml-php
      # - ml-nextjs
      # - ml-fastapi

  ml-postgres:
    container_name: ml-postgres
    image: postgres:15-alpine
    volumes:
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT_OUTSIDE_ENV}:${POSTGRES_PORT_INSIDE_ENV}"

  ml-redis:
    container_name: ml-redis
    image: redis:alpine
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_PORT_OUTSIDE_ENV}:${REDIS_PORT_INSIDE_ENV}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

