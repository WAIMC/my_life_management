# Upstream configurations
upstream ml_nextjs {
    server ml-nextjs:6543;
    keepalive 32;
}

upstream ml_php {
    server ml-php:9000;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# HTTP Server
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Client settings
    client_max_body_size 50M;
    client_body_timeout 60s;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Laravel API routes - Use ^~ to give this location priority
    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        # Pass all API requests to Laravel's index.php via FastCGI
        fastcgi_pass ml_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/laravel-api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
        
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # Laravel static assets
    location ~ ^/(css|js|images|fonts|storage)/ {
        root /var/www/laravel-api/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Next.js static assets (_next/static)
    location /_next/static/ {
        proxy_pass http://ml_nextjs;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Cache for 1 year (Next.js uses content hashing)
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Next.js public folder
    location /public/ {
        proxy_pass http://ml_nextjs;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Next.js API routes and pages (catch-all - MUST be last)
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        
        proxy_pass http://ml_nextjs;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts for SSR
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering for better streaming
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Cache settings
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_pragma $http_authorization;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.ht {
        deny all;
    }
}

