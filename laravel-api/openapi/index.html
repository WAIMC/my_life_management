<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swagger UI - Laravel API</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@4/swagger-ui.css" />
    <style>body { margin:0; }</style>
  </head>
  <body>
    <div style="padding:10px; background:#f7f7f7; display:flex; gap:12px; align-items:center;">
      <label>Server:</label>
      <select id="server-select">
        <option value="http://localhost:8000">http://localhost:8000</option>
        <option value="http://localhost:8080">http://localhost:8080</option>
      </select>
      <label>Bearer:</label>
      <input id="bearer-input" placeholder="JWT token" style="width:300px" />
      <button id="reload-spec">Reload</button>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@4/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script>
      // You can set the URL to the generated openapi.yaml file
      const specUrl = 'openapi.yaml';

      // Inject simple examples into the spec object so Swagger UI shows them
      function ensureExampleForResponse(op) {
        if (!op.responses) return;
        const res200 = op.responses['200'] || op.responses[200] || op.responses['default'];
        if (!res200) return;
        if (!res200.content) res200.content = {};
        const app = res200.content['application/json'];
        if (!app) {
          res200.content['application/json'] = { schema: { type: 'object' }, example: { success: true, data: {} } };
        } else {
          if (!app.example && !app.examples) {
            app.example = { success: true, data: {} };
          }
          if (!app.schema) app.schema = { type: 'object' };
        }
      }

      function ensureExampleForRequestBody(op) {
        if (!op.requestBody) return;
        const content = op.requestBody.content || op.requestBody['content'];
        if (!content) return;
        const app = content['application/json'];
        if (!app) {
          op.requestBody.content = op.requestBody.content || {};
          op.requestBody.content['application/json'] = { schema: { type: 'object' }, example: { foo: 'bar' } };
        } else {
          if (!app.example && !app.examples) {
            app.example = { foo: 'bar' };
          }
          if (!app.schema) app.schema = { type: 'object' };
        }
      }

      function mutateSpec(spec) {
        if (!spec.paths) return spec;
        for (const p of Object.keys(spec.paths)) {
          const ops = spec.paths[p];
          for (const method of Object.keys(ops)) {
            const op = ops[method];
            try {
              ensureExampleForResponse(op);
              ensureExampleForRequestBody(op);
            } catch (e) {
              // ignore
            }
          }
        }
        return spec;
      }

      window.onload = () => {
        const serverSelect = document.getElementById('server-select');
        const bearerInput = document.getElementById('bearer-input');
        const reloadBtn = document.getElementById('reload-spec');

        function createUIFromSpec(specObj, serverUrl) {
          return SwaggerUIBundle({
            spec: specObj,
            dom_id: '#swagger-ui',
            presets: [SwaggerUIBundle.presets.apis],
            layout: 'BaseLayout',
            requestInterceptor: (req) => {
              const token = bearerInput.value.trim();
              if (token) req.headers['Authorization'] = 'Bearer ' + token;
              // replace server in request URL if serverUrl provided
              try {
                const u = new URL(req.url);
                const base = new URL(serverUrl);
                u.hostname = base.hostname;
                u.port = base.port;
                u.protocol = base.protocol;
                req.url = u.toString();
              } catch (e) {
                // ignore
              }
              return req;
            }
          });
        }

        async function loadAndCreate(serverUrl) {
          const yamlText = await fetch(specUrl).then(r => r.text());
          const specObj = jsyaml.load(yamlText);
          const mutated = mutateSpec(specObj);
          document.getElementById('swagger-ui').innerHTML = '';
          const ui = createUIFromSpec(mutated, serverUrl);
          window.ui = ui;
        }

        loadAndCreate(serverSelect.value).catch(err => console.error(err));

        reloadBtn.addEventListener('click', () => {
          loadAndCreate(serverSelect.value).catch(err => console.error(err));
        });
      };
    </script>
  </body>
</html>
